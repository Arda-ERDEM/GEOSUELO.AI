openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: markers
    description: Surface infrastructure markers
  - name: assets
    description: Underground asset predictions
  - name: zones
    description: Excavation areas and risk analysis
  - name: dashboard
    description: Project overview
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get project overview metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /v1/markers:
    get:
      operationId: getMarkers
      tags: [markers]
      summary: List surface markers
      responses:
        "200":
          description: Surface markers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SurfaceMarker"
    post:
      operationId: createMarker
      tags: [markers]
      summary: Add a surface marker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurfaceMarkerInput"
      responses:
        "201":
          description: Created marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurfaceMarker"
  /v1/markers/{id}:
    patch:
      operationId: updateMarker
      tags: [markers]
      summary: Update a surface marker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurfaceMarkerInput"
      responses:
        "200":
          description: Updated marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SurfaceMarker"
        "404":
          description: Marker not found
    delete:
      operationId: deleteMarker
      tags: [markers]
      summary: Delete a surface marker
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted }
        "404": { description: Marker not found }
  /v1/assets:
    get:
      operationId: getAssets
      tags: [assets]
      summary: Query assets by center coordinate and radius
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - in: query
          name: lon
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - in: query
          name: radius
          required: false
          schema: { type: number, minimum: 1, maximum: 5000, default: 500 }
      responses:
        "200":
          description: Assets in radius
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UndergroundAsset"
  /v1/assets.geojson:
    get:
      operationId: getAssetsGeojson
      tags: [assets]
      summary: Export nearby vector assets as GeoJSON for GIS and BIM clients
      description: Coordinates use WGS84 (EPSG:4326) in GeoJSON order [longitude, latitude]. BIM clients should transform them to the project's coordinate system before placement.
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - in: query
          name: lon
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - in: query
          name: radius
          required: false
          schema: { type: number, minimum: 1, maximum: 5000, default: 500 }
      responses:
        "200":
          description: Nearby assets as a GeoJSON feature collection
          content:
            application/geo+json:
              schema:
                $ref: "#/components/schemas/AssetFeatureCollection"
  /v1/predictions:
    post:
      operationId: predictRoute
      tags: [assets]
      summary: Predict a route between compatible surface markers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictionInput"
      responses:
        "201":
          description: Predicted underground route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndergroundAsset"
        "400":
          description: Markers are incompatible or too far apart
  /v1/zones:
    get:
      operationId: getZones
      tags: [zones]
      summary: List excavation zones
      responses:
        "200":
          description: Excavation zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
    post:
      operationId: createZone
      tags: [zones]
      summary: Save an excavation zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneInput"
      responses:
        "201":
          description: Saved zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
  /v1/zones/{id}/analyze:
    post:
      operationId: analyzeZone
      tags: [zones]
      summary: Analyze predicted asset intersections with a zone
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Risk analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAnalysis"
        "404":
          description: Zone not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Coordinate:
      type: object
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
      required: [lat, lon]
    SurfaceMarker:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        lat: { type: number }
        lon: { type: number }
        type: { type: string, enum: [manhole, valve, transformer, hydrant] }
        utilityType: { type: string, enum: [water, gas, fiber, electric, sewer] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        createdAt: { type: string, format: date-time }
      required: [id, name, lat, lon, type, utilityType, confidence, createdAt]
    SurfaceMarkerInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        type: { type: string, enum: [manhole, valve, transformer, hydrant] }
        utilityType: { type: string, enum: [water, gas, fiber, electric, sewer] }
        confidence: { type: number, minimum: 0, maximum: 1 }
      required: [name, lat, lon, type, utilityType, confidence]
    UndergroundAsset:
      type: object
      properties:
        id: { type: string }
        utilityType: { type: string, enum: [water, gas, fiber, electric, sewer] }
        start: { $ref: "#/components/schemas/Coordinate" }
        end: { $ref: "#/components/schemas/Coordinate" }
        depthMeters: { type: number, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        dataSource: { type: string, enum: [ai_prediction, manual] }
        riskLevel: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
      required: [id, utilityType, start, end, depthMeters, confidence, dataSource, riskLevel, createdAt]
    PredictionInput:
      type: object
      properties:
        markerAId: { type: string }
        markerBId: { type: string }
      required: [markerAId, markerBId]
    Zone:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        polygon:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/Coordinate" }
        createdAt: { type: string, format: date-time }
      required: [id, name, polygon, createdAt]
    ZoneInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        polygon:
          type: array
          minItems: 3
          items: { $ref: "#/components/schemas/Coordinate" }
      required: [name, polygon]
    RiskConflict:
      type: object
      properties:
        asset: { $ref: "#/components/schemas/UndergroundAsset" }
        distanceMeters: { type: number }
      required: [asset, distanceMeters]
    AssetGeoJSONFeature:
      type: object
      properties:
        type: { type: string, enum: [Feature] }
        geometry:
          type: object
          properties:
            type: { type: string, enum: [LineString] }
            coordinates:
              type: array
              minItems: 2
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }
          required: [type, coordinates]
        properties:
          type: object
          properties:
            id: { type: string }
            utilityType: { type: string, enum: [water, gas, fiber, electric, sewer] }
            depthMeters: { type: number, minimum: 0 }
            confidence: { type: number, minimum: 0, maximum: 1 }
            dataSource: { type: string, enum: [ai_prediction, manual] }
            riskLevel: { type: integer, minimum: 1, maximum: 5 }
            createdAt: { type: string, format: date-time }
          required: [id, utilityType, depthMeters, confidence, dataSource, riskLevel, createdAt]
      required: [type, geometry, properties]
    AssetFeatureCollection:
      type: object
      properties:
        type: { type: string, enum: [FeatureCollection] }
        features:
          type: array
          items: { $ref: "#/components/schemas/AssetGeoJSONFeature" }
      required: [type, features]
    FinancialImpactAssessment:
      type: object
      properties:
        estimated: { type: boolean }
        amount: { type: ["number", "null"], minimum: 0 }
        currency: { type: ["string", "null"] }
        reason: { type: string }
      required: [estimated, amount, currency, reason]
    RiskAnalysis:
      type: object
      properties:
        zone: { $ref: "#/components/schemas/Zone" }
        riskScore: { type: integer, minimum: 0, maximum: 100 }
        riskLevel: { type: string, enum: [low, medium, high, critical] }
        assessmentMethod: { type: string, enum: [postgis_synthetic_vector_screening] }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/RiskConflict" }
        message: { type: string }
        evidence:
          type: array
          items: { type: string }
        unknowns:
          type: array
          items: { type: string }
        recommendedActions:
          type: array
          items: { type: string }
        financialImpact: { $ref: "#/components/schemas/FinancialImpactAssessment" }
      required: [zone, riskScore, riskLevel, assessmentMethod, conflicts, message, evidence, unknowns, recommendedActions, financialImpact]
    DashboardSummary:
      type: object
      properties:
        markerCount: { type: integer }
        assetCount: { type: integer }
        zoneCount: { type: integer }
        highRiskCount: { type: integer }
        averageConfidence: { type: number }
        recentAssets:
          type: array
          items: { $ref: "#/components/schemas/UndergroundAsset" }
      required: [markerCount, assetCount, zoneCount, highRiskCount, averageConfidence, recentAssets]

